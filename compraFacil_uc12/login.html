<!-- Tela do login-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CompraFácil | Login</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="js/login.js"></script>

</head>

<body>

    <main class="container">

        <section class="login-container">
            <!-- Logo -->
            <div class="logo">
                <img src="img/logo.png" alt="Logo CompraFácil">
            </div>

            <!-- Título -->
            <div class="login-titulo">
                <h1>Bem-vindo!</h1>
                <p>Entre na sua conta para continuar.</p>
            </div>

            <!-- Formulário -->
            <form class="login-form">

                <div class="campo">
                    <label for="usuario">E-mail ou CPF</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario"
                        placeholder="Digite seu e-mail ou CPF"
                        required
                    >
                </div>
            <div class="campo">
    <label for="senha">Senha</label>

    <div class="senha-container">

        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
        >

        <button type="button" id="mostrarSenha" aria-label="Mostrar senha">
            <i class="fa-solid fa-eye"></i>
        </button>

    </div>
                

</div>


                <button type="submit" class="botao-entrar">
                    Entrar
                </button>

            </form>

            <!-- Cadastro -->
            <div class="cadastro-link">
                <p>Ainda não tem uma conta?</p>
                <a href="cadastro.html">Criar conta</a>
            </div>

        </section>

    </main>

</body>
</html>
